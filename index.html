<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghazal 💜</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="shortcut icon" type="image/png" href="icon.png">

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

/* ================= THEME COLORS ================= */
:root{
    --p-300:#d8b4fe;
    --p-400:#c084fc;
    --p-500:#a855f7;
    --p-600:#7c3aed;
    --p-700:#5b21b6;
    --text-soft:#cdb8e6;
    --glow-rgb:168,85,247;
    --glow2-rgb:124,58,237;
    --pink-rgb:236,72,153;
}

*{margin:0;padding:0;box-sizing:border-box;}

html,body{width:100%;height:100%;overflow:hidden;}

body{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    overflow:hidden;
    font-family:"Vazirmatn",sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 15% 15%, rgba(var(--glow-rgb),.24), transparent 32%),
        radial-gradient(circle at 85% 85%, rgba(var(--glow2-rgb),.22), transparent 36%),
        radial-gradient(circle at 80% 15%, rgba(var(--pink-rgb),.10), transparent 30%),
        linear-gradient(135deg,#0a0414,#1a0838,#07020f);
}

/* ================= BACKGROUND GLOWS ================= */
.glow{position:fixed;width:500px;height:500px;border-radius:50%;filter:blur(120px);pointer-events:none;}
.glow1{left:-250px;top:-250px;background:rgba(var(--glow-rgb),.16);}
.glow2{right:-250px;bottom:-250px;background:rgba(var(--glow2-rgb),.16);}

/* ================= STARS ================= */
#stars{position:fixed;inset:0;pointer-events:none;}
.star{
    position:absolute;
    width:2px;height:2px;
    border-radius:50%;
    background:#e9d5ff;
    box-shadow:0 0 8px var(--p-500);
    animation:starPulse 2s ease-in-out infinite alternate;
}
@keyframes starPulse{
    from{opacity:.15;transform:scale(.7);}
    to{opacity:.9;transform:scale(1.4);}
}

/* ================= PARTICLES ================= */
#particles{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:5;}
.particle{
    position:absolute;
    bottom:-20px;
    border-radius:50%;
    background:var(--p-400);
    box-shadow:0 0 10px var(--p-500), 0 0 20px rgba(var(--glow-rgb),.5);
    animation:particleUp linear forwards;
}
@keyframes particleUp{
    0%{transform:translateY(0) scale(.4);opacity:0;}
    15%{opacity:.8;}
    100%{transform:translateY(-120vh) scale(1.2);opacity:0;}
}

/* ================= MAIN ================= */
.wrapper{
    position:fixed;
    inset:0;
    width:100vw;height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:10;
}

.card{
    position:relative;
    width:min(650px,94vw);
    min-height:450px;
    padding:55px 30px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    border-radius:36px;
    background:linear-gradient(160deg, rgba(34,12,66,.72), rgba(14,5,30,.78));
    border:1px solid rgba(192,132,252,.28);
    backdrop-filter:blur(28px);
    -webkit-backdrop-filter:blur(28px);
    box-shadow:
        0 35px 100px rgba(0,0,0,.6),
        inset 0 0 50px rgba(var(--glow-rgb),.06),
        inset 0 1px 0 rgba(255,255,255,.08),
        0 0 80px rgba(var(--glow-rgb),.16);
}

/* subtle glowing border */
.card::before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:37px;
    padding:1px;
    background:linear-gradient(135deg, rgba(216,180,254,.55), transparent 35%, transparent 65%, rgba(var(--pink-rgb),.35));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    pointer-events:none;
}

.content{width:100%;}

.step{animation:stepIn .55s ease;}
@keyframes stepIn{
    from{opacity:0;transform:translateY(20px) scale(.94);}
    to{opacity:1;transform:translateY(0) scale(1);}
}

/* ================= TEXT ================= */
.name{
    color:var(--p-300);
    font-size:21px;
    font-weight:700;
    margin-bottom:15px;
    text-shadow:0 0 20px rgba(var(--glow-rgb),.8);
}

.question{
    font-size:clamp(28px,5vw,44px);
    font-weight:800;
    line-height:1.7;
    margin-bottom:18px;
    color:#fff;
}

.gradient-text{
    background:linear-gradient(90deg,#ffffff,#c084fc,#f0abfc,#ffffff);
    background-size:200% auto;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shine 4s linear infinite;
}
@keyframes shine{to{background-position:200% center;}}

/* ================= EMOJI FIX ================= */
.emoji{
    display:inline-block;
    font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
    color:initial !important;
    background:none !important;
    background-image:none !important;
    -webkit-text-fill-color:initial !important;
    -webkit-background-clip:initial !important;
    background-clip:initial !important;
}

.description{
    color:var(--text-soft);
    font-size:15px;
    line-height:2;
    margin-bottom:35px;
}

/* ================= BUTTONS ================= */
.buttons{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    min-height:65px;
}

button{
    font-family:inherit;
    border:none;
    outline:none;
    font-size:16px;
    font-weight:700;
    padding:15px 30px;
    border-radius:17px;
}

/* YES */
.yes-btn{
    position:relative;
    z-index:10;
    cursor:pointer;
    color:#fff;
    background:linear-gradient(135deg,#c084fc,#a855f7 45%,#7c3aed);
    box-shadow:0 10px 35px rgba(var(--glow-rgb),.45), inset 0 1px 0 rgba(255,255,255,.25);
    transition:transform .25s ease, box-shadow .25s ease;
}
.yes-btn:hover{
    transform:translateY(-4px) scale(1.06);
    box-shadow:0 18px 45px rgba(var(--glow-rgb),.65), inset 0 1px 0 rgba(255,255,255,.3);
}

/* NO */
.no-btn{
    position:fixed;
    z-index:999999;
    min-width:115px;
    min-height:50px;
    padding:14px 28px;
    color:#e6d9f5;
    background:rgba(255,255,255,.065);
    border:1px solid rgba(216,180,254,.2);
    box-shadow:0 8px 25px rgba(0,0,0,.30);
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
    will-change:left,top,transform;
    touch-action:none;
}

/* ================= FINAL ================= */
.final-heart{
    font-size:85px;
    margin-bottom:15px;
    filter:drop-shadow(0 0 25px rgba(var(--glow-rgb),.9));
    animation:heartbeat 1.25s infinite;
}
@keyframes heartbeat{
    0%,100%{transform:scale(1);}
    15%{transform:scale(1.18);}
    30%{transform:scale(1);}
    45%{transform:scale(1.12);}
}

.final-title{
    font-size:clamp(28px,5vw,43px);
    font-weight:800;
    margin-bottom:15px;
}

.final-text{color:var(--text-soft);line-height:2;}

/* ================= MOBILE ================= */
@media(max-width:600px){
    .card{min-height:430px;padding:45px 20px;}
    button{font-size:14px;padding:13px 22px;}
}
</style>
</head>

<body>

<div class="glow glow1"></div>
<div class="glow glow2"></div>
<div id="stars"></div>
<div id="particles"></div>

<div class="wrapper">
    <div class="card">
        <div class="content" id="content">

            <!-- STEP 1 -->
            <div class="step">
                <div class="name">
                    Ghazal
                    <span class="emoji">💜</span>
                </div>

                <div class="question">
                    <span class="gradient-text">
                        دیگه وقتشه<br>
                        سوالمو ازت بپرسم...
                    </span>
                </div>

                <div class="description">
                    یه سوال کوچولوئه...
                    <br>
                    ولی جوابش برای من خیلی مهمه :)
                </div>

                <div class="buttons">
                    <button class="yes-btn" onclick="nextStep()">
                        ادامه بده
                        <span class="emoji">💜</span>
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>

<script>

/* ================= SETTINGS ================= */

const ESCAPE_DISTANCE = 120;   // فاصله‌ای که دکمه شروع به فرار می‌کند
const PANIC_DISTANCE = 28;     // فاصله خیلی نزدیک
const EDGE_MARGIN = 30;        // حداقل فاصله از لبه صفحه
const EDGE_ZONE = 160;         // منطقه‌ای که دکمه از لبه‌ها دور می‌شود
const MAX_SPEED = 10;          // حداکثر سرعت
const ACCELERATION = .42;      // شتاب حرکت
const PANIC_POWER = 2.7;       // قدرت فرار وقتی موس خیلی نزدیک است
const FRICTION = .90;          // اصطکاک
const ESCAPES_TO_EXPLODE = 4;  // تعداد فرار لازم برای انفجار


/* ================= VARIABLES ================= */

let noButton = null;
let running = false;
let exploding = false;
let escapeCount = 0;
let mouseX = -10000;
let mouseY = -10000;
let buttonX = 0;
let buttonY = 0;
let velocityX = 0;
let velocityY = 0;
let lastTime = 0;
let lastEscapeTime = 0;


/* ================= MOUSE ================= */

document.addEventListener("mousemove", function(e){
    mouseX = e.clientX;
    mouseY = e.clientY;
});


/* ================= HELPERS ================= */

function getViewport(){
    return {
        width: document.documentElement.clientWidth,
        height: document.documentElement.clientHeight
    };
}

function clamp(value, min, max){
    return Math.max(min, Math.min(value, max));
}

function limitSpeed(){
    const speed = Math.hypot(velocityX, velocityY);
    if(speed > MAX_SPEED){
        velocityX = velocityX / speed * MAX_SPEED;
        velocityY = velocityY / speed * MAX_SPEED;
    }
}


/* ================= KEEP INSIDE ================= */

function keepInside(){

    if(!noButton) return;

    const view = getViewport();
    const width = noButton.offsetWidth;
    const height = noButton.offsetHeight;

    const minX = EDGE_MARGIN;
    const minY = EDGE_MARGIN;
    const maxX = Math.max(minX, view.width - width - EDGE_MARGIN);
    const maxY = Math.max(minY, view.height - height - EDGE_MARGIN);

    if(buttonX < minX){ buttonX = minX; velocityX = Math.abs(velocityX); }
    if(buttonX > maxX){ buttonX = maxX; velocityX = -Math.abs(velocityX); }
    if(buttonY < minY){ buttonY = minY; velocityY = Math.abs(velocityY); }
    if(buttonY > maxY){ buttonY = maxY; velocityY = -Math.abs(velocityY); }

    buttonX = clamp(buttonX, minX, maxX);
    buttonY = clamp(buttonY, minY, maxY);
}


/* ================= EDGE AVOIDANCE ================= */

function avoidEdges(){

    if(!noButton) return;

    const view = getViewport();
    const width = noButton.offsetWidth;
    const height = noButton.offsetHeight;

    const left = buttonX;
    const right = view.width - buttonX - width;
    const top = buttonY;
    const bottom = view.height - buttonY - height;

    if(left < EDGE_ZONE){ velocityX += (1 - left / EDGE_ZONE) * .85; }
    if(right < EDGE_ZONE){ velocityX -= (1 - right / EDGE_ZONE) * .85; }
    if(top < EDGE_ZONE){ velocityY += (1 - top / EDGE_ZONE) * .85; }
    if(bottom < EDGE_ZONE){ velocityY -= (1 - bottom / EDGE_ZONE) * .85; }

    /* جلوگیری از گیر کردن در گوشه‌ها */
    if(left < EDGE_ZONE && top < EDGE_ZONE){ velocityX += .55; velocityY += .55; }
    if(right < EDGE_ZONE && top < EDGE_ZONE){ velocityX -= .55; velocityY += .55; }
    if(left < EDGE_ZONE && bottom < EDGE_ZONE){ velocityX += .55; velocityY -= .55; }
    if(right < EDGE_ZONE && bottom < EDGE_ZONE){ velocityX -= .55; velocityY -= .55; }
}


/* ================= ESCAPE ================= */

function escapeFromMouse(distance){

    if(!noButton || exploding) return;

    const now = performance.now();

    if(distance <= PANIC_DISTANCE && now - lastEscapeTime > 600){

        lastEscapeTime = now;
        escapeCount++;

        if(escapeCount >= ESCAPES_TO_EXPLODE){
            explodeNoButton();
            return;
        }
    }

    const centerX = buttonX + noButton.offsetWidth / 2;
    const centerY = buttonY + noButton.offsetHeight / 2;

    let dx = centerX - mouseX;
    let dy = centerY - mouseY;

    const length = Math.hypot(dx, dy);

    if(length < .001){
        const a = Math.random() * Math.PI * 2;
        dx = Math.cos(a);
        dy = Math.sin(a);
    }else{
        dx /= length;
        dy /= length;
    }

    /* کمی زاویه تصادفی */
    const angle = (Math.random() - .5) * .20;
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);

    const escapeX = dx * cos - dy * sin;
    const escapeY = dx * sin + dy * cos;

    velocityX += escapeX * ACCELERATION;
    velocityY += escapeY * ACCELERATION;

    if(distance < PANIC_DISTANCE){
        velocityX += escapeX * PANIC_POWER;
        velocityY += escapeY * PANIC_POWER;
    }

    if(distance < ESCAPE_DISTANCE){
        const force = (ESCAPE_DISTANCE - distance) / ESCAPE_DISTANCE;
        velocityX += escapeX * force * .65;
        velocityY += escapeY * force * .65;
    }

    limitSpeed();
}


/* ================= APPLY POSITION ================= */

function applyPosition(){
    if(!noButton) return;
    noButton.style.left = buttonX + "px";
    noButton.style.top = buttonY + "px";
}


/* ================= MAIN LOOP ================= */

function gameLoop(timestamp){

    if(!running || !noButton || exploding) return;

    if(lastTime === 0) lastTime = timestamp;

    let dt = (timestamp - lastTime) / 16.666;
    lastTime = timestamp;
    dt = Math.min(dt, 1.5);

    const rect = noButton.getBoundingClientRect();

    const closestX = Math.max(rect.left, Math.min(mouseX, rect.right));
    const closestY = Math.max(rect.top, Math.min(mouseY, rect.bottom));

    const distance = Math.hypot(mouseX - closestX, mouseY - closestY);

    if(distance < ESCAPE_DISTANCE){
        escapeFromMouse(distance);
    }

    avoidEdges();

    buttonX += velocityX * dt;
    buttonY += velocityY * dt;

    const friction = Math.pow(FRICTION, dt);
    velocityX *= friction;
    velocityY *= friction;

    /* اگر سرعت خیلی کم شد و موس هنوز نزدیک است */
    const speed = Math.hypot(velocityX, velocityY);

    if(speed < .25 && distance < ESCAPE_DISTANCE){

        const centerX = buttonX + noButton.offsetWidth / 2;
        const centerY = buttonY + noButton.offsetHeight / 2;

        let dx = centerX - mouseX;
        let dy = centerY - mouseY;
        const d = Math.hypot(dx, dy);

        if(d > .001){
            dx /= d;
            dy /= d;
        }

        velocityX += dx * .75;
        velocityY += dy * .75;
    }

    limitSpeed();
    keepInside();
    applyPosition();

    requestAnimationFrame(gameLoop);
}


/* ================= EXPLOSION ================= */

function explodeNoButton(){

    if(!noButton || exploding) return;

    exploding = true;
    running = false;

    const rect = noButton.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    noButton.style.pointerEvents = "none";

    noButton.animate([
        { transform:"scale(1) rotate(0deg)", opacity:1 },
        { transform:"scale(1.18) rotate(-5deg)", opacity:1 },
        { transform:"scale(1.28) rotate(5deg)", opacity:.95 },
        { transform:"scale(.75) rotate(-10deg)", opacity:.65 },
        { transform:"scale(1.7) rotate(15deg)", opacity:.25 },
        { transform:"scale(0)", opacity:0 }
    ],{
        duration:700,
        easing:"cubic-bezier(.2,.8,.2,1)",
        fill:"forwards"
    });

    /* Flash */
    const flash = document.createElement("div");
    flash.style.position = "fixed";
    flash.style.left = centerX + "px";
    flash.style.top = centerY + "px";
    flash.style.width = "20px";
    flash.style.height = "20px";
    flash.style.borderRadius = "50%";
    flash.style.background = "#ffffff";
    flash.style.boxShadow = "0 0 20px #ffffff, 0 0 50px #c084fc, 0 0 100px #7c3aed";
    flash.style.pointerEvents = "none";
    flash.style.zIndex = "1000001";
    document.body.appendChild(flash);

    flash.animate([
        { transform:"translate(-50%,-50%) scale(.2)", opacity:1 },
        { transform:"translate(-50%,-50%) scale(7)", opacity:0 }
    ],{
        duration:600,
        easing:"ease-out",
        fill:"forwards"
    });

    setTimeout(() => flash.remove(), 700);

    for(let i = 0; i < 70; i++){
        createExplosionParticle(centerX, centerY);
    }

    /* لرزش کارت */
    const card = document.querySelector(".card");

    if(card){
        card.animate([
            { transform:"translateX(0)" },
            { transform:"translateX(-7px)" },
            { transform:"translateX(7px)" },
            { transform:"translateX(-5px)" },
            { transform:"translateX(5px)" },
            { transform:"translateX(0)" }
        ],{
            duration:450,
            easing:"ease-out"
        });
    }

    setTimeout(function(){

        if(noButton){
            noButton.remove();
            noButton = null;
        }

        const description = document.querySelector(".description");

        if(description){
            description.innerHTML = `
                دکمه «نه» منفجر شد! 💥
                <br>
                فکر کنم دیگه راه فراری نداری 😂💜
            `;
        }

    }, 720);
}


/* ================= EXPLOSION PARTICLE ================= */

function createExplosionParticle(x, y){

    const particle = document.createElement("div");

    particle.style.position = "fixed";
    particle.style.left = x + "px";
    particle.style.top = y + "px";

    const size = 3 + Math.random() * 8;

    particle.style.width = size + "px";
    particle.style.height = size + "px";
    particle.style.borderRadius = "50%";
    particle.style.background = Math.random() > .3 ? "#c084fc" : "#ffffff";
    particle.style.boxShadow = "0 0 12px #a855f7";
    particle.style.pointerEvents = "none";
    particle.style.zIndex = "1000000";

    document.body.appendChild(particle);

    const angle = Math.random() * Math.PI * 2;
    const distance = 80 + Math.random() * 220;
    const endX = Math.cos(angle) * distance;
    const endY = Math.sin(angle) * distance;

    particle.animate([
        {
            transform:"translate(-50%,-50%) scale(1)",
            opacity:1
        },
        {
            transform:`translate(calc(-50% + ${endX}px), calc(-50% + ${endY}px)) scale(0)`,
            opacity:0
        }
    ],{
        duration:650 + Math.random() * 650,
        easing:"cubic-bezier(.15,.75,.2,1)",
        fill:"forwards"
    });

    setTimeout(() => particle.remove(), 1500);
}


/* ================= NEXT STEP ================= */

function nextStep(){

    document.getElementById("content").innerHTML = `

        <div class="step">

            <div class="name">
                Ghazal...
                <span class="emoji">💜</span>
            </div>

            <div class="question">
                <span class="gradient-text">من ازت خوشم میاد...</span>
                <br>
                <span class="gradient-text">تو چی؟</span>
                <span class="emoji">😳</span>
            </div>

            <div class="description">
                یه جواب ساده می‌خوام...
                <br>
                آره یا نه؟
            </div>

            <div class="buttons">

                <button class="yes-btn" onclick="sayYes()">
                    آره
                    <span class="emoji">💜</span>
                </button>

                <button class="no-btn" id="noButton">
                    نه
                    <span class="emoji">😈</span>
                </button>

            </div>

        </div>
    `;

    noButton = document.getElementById("noButton");

    escapeCount = 0;
    exploding = false;
    velocityX = 0;
    velocityY = 0;
    lastTime = 0;
    lastEscapeTime = 0;

    const rect = noButton.getBoundingClientRect();

    buttonX = rect.left;
    buttonY = rect.top;

    keepInside();
    applyPosition();

    running = true;
    requestAnimationFrame(gameLoop);

    noButton.addEventListener("click", function(e){

        e.preventDefault();
        e.stopPropagation();

        if(exploding) return;

        noButton.innerHTML = `
            نه نه نه
            <span class="emoji">😈</span>
        `;
    });
}


/* ================= YES ================= */

function sayYes(){

    running = false;
    exploding = true;
    noButton = null;

    document.getElementById("content").innerHTML = `

        <div class="step">

            <div class="final-heart">💜</div>

            <div class="final-title">
                می‌دونستم! 😭💜
            </div>

            <div class="final-text">
                پس بالاخره گفتی آره 😌
                <br><br>
                فکر کنم از اینجا به بعد داستانمون قشنگ‌تر بشه...
                <br><br>
                Ghazal
                <span class="emoji">💜</span>
            </div>

        </div>
    `;

    for(let i = 0; i < 50; i++){
        setTimeout(createParticle, i * 35);
    }
}


/* ================= FLOATING PARTICLE ================= */

function createParticle(){

    const container = document.getElementById("particles");
    if(!container) return;

    const particle = document.createElement("div");
    particle.className = "particle";
    particle.style.left = Math.random() * 100 + "%";

    const size = 3 + Math.random() * 7;

    particle.style.width = size + "px";
    particle.style.height = size + "px";
    particle.style.animationDuration = (5 + Math.random() * 7) + "s";

    container.appendChild(particle);

    setTimeout(function(){ particle.remove(); }, 14000);
}


/* ================= STARS ================= */

function createStars(){

    const container = document.getElementById("stars");

    for(let i = 0; i < 80; i++){

        const star = document.createElement("div");
        star.className = "star";
        star.style.left = Math.random() * 100 + "%";
        star.style.top = Math.random() * 100 + "%";
        star.style.animationDelay = Math.random() * 3 + "s";

        container.appendChild(star);
    }
}


/* ================= START ================= */

createStars();

for(let i = 0; i < 10; i++){
    setTimeout(createParticle, i * 300);
}

setInterval(createParticle, 1200);


/* ================= RESIZE ================= */

window.addEventListener("resize", function(){

    if(!noButton || exploding) return;

    keepInside();
    applyPosition();
});

</script>

</body>
</html>
